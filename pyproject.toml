[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delta-chat"
version = "0.1.0"
description = "Document delta computation and grounded chat over document revisions"
requires-python = ">=3.11"
dependencies = [
  "pymupdf>=1.24", "reportlab>=4.0", "ezdxf>=1.3", "pillow>=10",
  "numpy>=1.26", "rapidfuzz>=3.6", "scipy>=1.12", "anthropic>=0.40",
  "pytesseract>=0.3.10", "python-dotenv>=1.0", "pyyaml>=6.0",
  # headless, not the default opencv-python: this project uses cv2 purely for
  # image processing (warpAffine, morphology, connected components) and never
  # opens a GUI window. The default wheel links libGL, which is absent from
  # slim container images -- caught by an actual `docker build`, where every
  # cv2-importing test failed collection with "libGL.so.1: cannot open shared
  # object file". headless drops that dependency entirely rather than
  # installing an X11/mesa stack we would never call into.
  "opencv-python-headless>=4.9", "scikit-image>=0.22",
]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]
[tool.setuptools.packages.find]
where = ["src"]
