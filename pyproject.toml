[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delta-chat"
version = "0.1.0"
description = "Document delta computation and grounded chat over document revisions"
requires-python = ">=3.11"
dependencies = [
  "pymupdf>=1.24", "reportlab>=4.0", "ezdxf>=1.3", "pillow>=10",
  "numpy>=1.26", "rapidfuzz>=3.6", "scipy>=1.12", "anthropic>=0.40",
  "pytesseract>=0.3.10", "python-dotenv>=1.0", "pyyaml>=6.0",
  # headless, not the default opencv-python: this project uses cv2 purely for
  # image processing (warpAffine, morphology, connected components) and never
  # opens a GUI window. The default wheel links libGL, which is absent from
  # slim container images -- caught by an actual `docker build`, where every
  # cv2-importing test failed collection with "libGL.so.1: cannot open shared
  # object file". headless drops that dependency entirely rather than
  # installing an X11/mesa stack we would never call into.
  "opencv-python-headless>=4.9", "scikit-image>=0.22",
  # Web UI (src/web/). python-multipart is not optional despite looking like
  # it: FastAPI raises at import time on any route declaring UploadFile
  # without it installed, so the app would fail to start rather than fail on
  # first upload. No jinja2 -- the frontend is static files, and the one
  # templated artifact (report.html) predates this and does its own
  # placeholder substitution.
  "fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9",
]
[project.optional-dependencies]
# httpx is what starlette's TestClient runs on -- dev-only, the server itself
# never makes outbound HTTP.
dev = ["pytest>=8", "ruff>=0.4", "httpx>=0.27"]
[tool.setuptools.packages.find]
where = ["src"]
